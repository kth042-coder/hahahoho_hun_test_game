<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바른 블록 퍼즐</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts: NanumSquare (참고 사이트와 동일 계열) + Noto Sans KR fallback -->
    <link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #8dc63f;      /* 메인 그린 */
            --green-dark: #056130; /* 딥 그린 */
            --olive: #68a12a;
            --beige: #ece9de;
            --cream: #f7f6f0;
            --text: #333333;
            --muted: #7a7a7a;
            --line: #e6e6e6;
        }
        body {
            font-family: 'NanumSquare', 'Noto Sans KR', '맑은 고딕', sans-serif;
            touch-action: manipulation;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 0%, rgba(141, 198, 63, 0.18), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(5, 97, 48, 0.10), transparent 40%),
                var(--cream);
        }
        .leaf-dot {
            width: 10px; height: 10px;
            border-radius: 0 100% 0 100%;
            background: var(--green);
            display: inline-block;
        }
        /* Custom animations for clearing blocks */
        @keyframes popClear {
            0% { transform: scale(1); background-color: #facc15; }
            50% { transform: scale(1.2); background-color: #ffffff; }
            100% { transform: scale(0); opacity: 0; }
        }
        .animate-pop {
            animation: popClear 0.4s ease-out forwards;
        }
        /* Smooth transitions */
        .piece-cell {
            transition: transform 0.1s ease, background-color 0.15s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none overflow-x-hidden">

    <!-- Header / Score Board -->
    <header class="w-full max-w-md flex flex-col items-center gap-3 mb-2">
        <div class="flex flex-col items-center gap-1 pt-2">
            <p class="text-[13px] font-bold tracking-[0.2em] text-[#68a12a] flex items-center gap-2">
                <span class="leaf-dot"></span> 나를 위해. 지구를 위해. <span class="leaf-dot" style="transform: scaleX(-1)"></span>
            </p>
            <h1 class="text-3xl font-black tracking-tight text-[#056130]">
                바른 <span class="text-[#8dc63f]">블록</span> 퍼즐
            </h1>
        </div>
        <div class="flex justify-between items-center w-full px-6 py-3 bg-white border border-[#e6e6e6] rounded-[20px] shadow-[0_8px_24px_rgba(5,97,48,0.08)]">
            <div class="text-center flex-1">
                <p class="text-xs text-[#7a7a7a] font-bold tracking-wider">점수</p>
                <p id="score" class="text-2xl font-black text-[#056130]">0</p>
            </div>
            <div class="h-8 w-px bg-[#e6e6e6]"></div>
            <div class="text-center flex-1">
                <p class="text-xs text-[#7a7a7a] font-bold tracking-wider">최고 점수</p>
                <p id="high-score" class="text-2xl font-black text-[#8dc63f]">0</p>
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="w-full max-w-md flex flex-col items-center gap-5 my-auto">
        <!-- 9x9 Grid -->
        <div id="grid-container" class="relative bg-white p-3 rounded-[20px] border border-[#e6e6e6] shadow-[0_12px_32px_rgba(5,97,48,0.12)] grid grid-cols-9 gap-1 w-full aspect-square max-w-[380px]">
            <!-- Grid cells generated dynamically via JS -->
        </div>

        <!-- Piece Selection Tray -->
        <div id="tray" class="flex justify-around items-center w-full bg-[#ece9de] border border-[#e0dccb] rounded-[20px] p-4 min-h-[130px]">
            <!-- 3 available pieces generated dynamically via JS -->
        </div>
    </main>

    <!-- Controls / Action Buttons -->
    <footer class="w-full max-w-md flex justify-center gap-3 mt-4">
        <button id="restart-btn" class="px-6 py-3 bg-[#8dc63f] hover:bg-[#68a12a] text-white font-extrabold rounded-full shadow-[0_6px_16px_rgba(141,198,63,0.35)] active:scale-95 transition-all">
            새 게임
        </button>
        <button id="sound-btn" class="toggle-btn is-on px-4 py-3 bg-white hover:bg-[#f5f5f5] border border-[#d4d4d4] text-[#333] font-bold rounded-full active:scale-95 transition-all flex items-center gap-2">
            🔊 <span id="sound-text">소리 켜짐</span>
        </button>
        <button id="music-btn" class="toggle-btn is-on px-4 py-3 bg-white hover:bg-[#f5f5f5] border border-[#d4d4d4] text-[#333] font-bold rounded-full active:scale-95 transition-all flex items-center gap-2">
            🎵 <span id="music-text">BGM 켜짐</span>
        </button>
    </footer>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="fixed inset-0 bg-[#056130]/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-[24px] p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center gap-4">
            <div class="w-16 h-16 bg-[#8dc63f]/15 rounded-full flex items-center justify-center text-3xl mb-1">
                🌱
            </div>
            <h2 class="text-2xl font-black text-[#056130]">게임 오버!</h2>
            <p class="text-[#7a7a7a] text-sm">더 이상 블록을 놓을 공간이 없습니다.</p>
            <div class="bg-[#f7f6f0] rounded-[20px] p-4 w-full border border-[#ece9de] my-2">
                <p class="text-xs text-[#7a7a7a] font-bold">최종 점수</p>
                <p id="final-score" class="text-3xl font-black text-[#8dc63f]">0</p>
            </div>
            <button id="modal-restart-btn" class="w-full py-3.5 bg-[#8dc63f] hover:bg-[#68a12a] text-white font-extrabold rounded-full shadow-[0_6px_16px_rgba(141,198,63,0.35)] active:scale-95 transition-all">
                다시 시작하기
            </button>
        </div>
    </div>

    <!-- Message notification overlay -->
    <div id="toast" class="fixed bottom-10 bg-[#056130] text-white px-5 py-2.5 rounded-full shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-40 text-sm font-bold">
        알림 메시지
    </div>

    <script>
        // --- Game Shapes & Colors ---
        const SHAPES = [
            // Single cell
            [[1]],
            // 2x1 & 1x2
            [[1, 1]],
            [[1], [1]],
            // 3x1 & 1x3
            [[1, 1, 1]],
            [[1], [1], [1]],
            // 2x2 Square
            [[1, 1], [1, 1]],
            // 3x3 Square
            [[1, 1, 1], [1, 1, 1], [1, 1, 1]],
            // L Shapes
            [[1, 0], [1, 1]],
            [[0, 1], [1, 1]],
            [[1, 1], [1, 0]],
            [[1, 1], [0, 1]],
            // T Shapes
            [[1, 1, 1], [0, 1, 0]],
            [[0, 1, 0], [1, 1, 1]]
        ];

        const COLORS = [
            // 자연·식재료 톤 팔레트 (그린 계열 중심)
            { bg: 'bg-[#8dc63f]', shadow: 'shadow-[#8dc63f]/50' }, // 메인 그린
            { bg: 'bg-[#056130]', shadow: 'shadow-[#056130]/50' }, // 딥 그린
            { bg: 'bg-[#68a12a]', shadow: 'shadow-[#68a12a]/50' }, // 올리브
            { bg: 'bg-[#b7d47f]', shadow: 'shadow-[#b7d47f]/50' }, // 연두
            { bg: 'bg-[#f2b134]', shadow: 'shadow-[#f2b134]/50' }, // 옥수수
            { bg: 'bg-[#e8743b]', shadow: 'shadow-[#e8743b]/50' }, // 당근
            { bg: 'bg-[#d9483b]', shadow: 'shadow-[#d9483b]/50' }, // 토마토
            { bg: 'bg-[#766c56]', shadow: 'shadow-[#766c56]/50' }  // 흙/곡물
        ];

        // --- Game State & Constants ---
        const GRID_SIZE = 9;
        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0)); // 0: empty, color string: filled
        let score = 0;
        let highScore = localStorage.getItem('block_puzzle_highscore') || 0;
        let availablePieces = [null, null, null];
        let selectedPieceIndex = null;
        let soundEnabled = true;
        let musicEnabled = true;

        // --- Web Audio API Sound Effects & Background Music ---
        let audioCtx = null;
        let bgmInterval = null;
        let bgmStep = 0;

        // Simple pentatonic chords melody for background music
        const BGM_NOTES = [
            261.63, 329.63, 392.00, 523.25, // C4, E4, G4, C5
            293.66, 349.23, 440.00, 587.33, // D4, F4, A4, D5
            329.63, 392.00, 493.88, 659.25, // E4, G4, B4, E5
            349.23, 440.00, 523.25, 698.46  // F4, A4, C5, F5
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBGMStep() {
            if (!musicEnabled || !audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            const noteFreq = BGM_NOTES[bgmStep % BGM_NOTES.length];
            osc.frequency.setValueAtTime(noteFreq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
            
            bgmStep = (bgmStep + 1) % BGM_NOTES.length;
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            bgmInterval = setInterval(playBGMStep, 400);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'place') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(261.63, now); // C4
                osc.frequency.exponentialRampToValueAtTime(523.25, now + 0.12); // C5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'clear') {
                // Arpeggio sound effect on line clear
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.18, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.05 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + idx * 0.05 + 0.15);
                });
            } else if (type === 'gameover') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }

        // --- DOM Elements ---
        const gridContainer = document.getElementById('grid-container');
        const trayContainer = document.getElementById('tray');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverModal = document.getElementById('game-over-modal');
        const restartBtn = document.getElementById('restart-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const soundBtn = document.getElementById('sound-btn');
        const soundText = document.getElementById('sound-text');
        const musicBtn = document.getElementById('music-btn');
        const musicText = document.getElementById('music-text');
        const toastEl = document.getElementById('toast');

        // --- Initialization ---
        function initGame() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            selectedPieceIndex = null;
            gameOverModal.classList.add('hidden');
            updateScoreDisplay();
            generateNewPieces();
            renderGrid();
            renderTray();

            initAudio();
            if (musicEnabled) {
                startBGM();
            }
        }

        highScoreEl.textContent = highScore;

        // --- Rendering ---
        function renderGrid(previewCells = []) {
            gridContainer.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'w-full aspect-square rounded-md transition-all duration-150 flex items-center justify-center';
                    
                    const isPreview = previewCells.some(p => p.r === r && p.c === c);
                    
                    if (grid[r][c] !== 0) {
                        cell.className += ` ${grid[r][c]} shadow-inner`;
                    } else if (isPreview) {
                        cell.className += ` bg-[#8dc63f]/35 border border-[#8dc63f] animate-pulse`;
                    } else {
                        // 3x3 구역을 번갈아 크림/베이지로 구분
                        const altBox = (Math.floor(r / 3) + Math.floor(c / 3)) % 2 === 0;
                        cell.className += altBox
                            ? ` bg-[#f7f6f0] border border-[#ece9de] hover:bg-[#edecd4]`
                            : ` bg-[#ece9de] border border-[#e0dccb] hover:bg-[#e3dfcc]`;
                    }

                    // Click to place piece if a piece is selected
                    cell.addEventListener('click', () => handleGridClick(r, c));
                    cell.addEventListener('mouseenter', () => handleGridHover(r, c));
                    
                    gridContainer.appendChild(cell);
                }
            }
            gridContainer.onmouseleave = () => renderGrid();
        }

        function renderTray() {
            trayContainer.innerHTML = '';
            availablePieces.forEach((piece, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `cursor-pointer p-2 rounded-xl flex items-center justify-center transition-all ${selectedPieceIndex === index ? 'bg-white border-2 border-[#8dc63f] scale-105 shadow-lg shadow-[#8dc63f]/30' : 'bg-white/60 border border-transparent hover:bg-white hover:border-[#d4d4d4]'}`;
                
                if (piece === null) {
                    wrapper.className += ' opacity-30 cursor-not-allowed';
                    trayContainer.appendChild(wrapper);
                    return;
                }

                // Render miniature matrix for the piece
                const rows = piece.shape.length;
                const cols = piece.shape[0].length;
                
                const miniGrid = document.createElement('div');
                miniGrid.className = `grid gap-1`;
                miniGrid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const mCell = document.createElement('div');
                        mCell.className = 'w-5 h-5 rounded';
                        if (piece.shape[r][c] === 1) {
                            mCell.className += ` ${piece.color.bg} shadow-sm ${piece.color.shadow}`;
                        } else {
                            mCell.className += ' bg-transparent';
                        }
                        miniGrid.appendChild(mCell);
                    }
                }

                wrapper.appendChild(miniGrid);
                wrapper.addEventListener('click', () => {
                    if (availablePieces[index] !== null) {
                        selectedPieceIndex = (selectedPieceIndex === index) ? null : index;
                        renderTray();
                        renderGrid();
                    }
                });

                trayContainer.appendChild(wrapper);
            });
        }

        // --- Piece Generation ---
        function getRandomPiece() {
            const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            return { shape: randomShape, color: randomColor };
        }

        function generateNewPieces() {
            availablePieces = [getRandomPiece(), getRandomPiece(), getRandomPiece()];
            checkGameOver();
        }

        // --- Game Logic: Hover & Placement ---
        function handleGridHover(r, c) {
            if (selectedPieceIndex === null || availablePieces[selectedPieceIndex] === null) return;
            const piece = availablePieces[selectedPieceIndex];
            const preview = getPlacementCoordinates(r, c, piece.shape);
            
            if (canPlace(r, c, piece.shape)) {
                renderGrid(preview);
            } else {
                renderGrid();
            }
        }

        function getPlacementCoordinates(startR, startC, shape) {
            const coords = [];
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c] === 1) {
                        coords.push({ r: startR + r, c: startC + c });
                    }
                }
            }
            return coords;
        }

        function canPlace(startR, startC, shape) {
            const rows = shape.length;
            const cols = shape[0].length;

            if (startR + rows > GRID_SIZE || startC + cols > GRID_SIZE) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1) {
                        if (grid[startR + r][startC + c] !== 0) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function handleGridClick(r, c) {
            if (selectedPieceIndex === null || availablePieces[selectedPieceIndex] === null) {
                showToast("선택된 블록이 없습니다.");
                return;
            }

            const piece = availablePieces[selectedPieceIndex];

            if (!canPlace(r, c, piece.shape)) {
                showToast("여기에 블록을 놓을 수 없습니다!");
                return;
            }

            // Place piece
            let placedCount = 0;
            for (let pr = 0; pr < piece.shape.length; pr++) {
                for (let pc = 0; pc < piece.shape[0].length; pc++) {
                    if (piece.shape[pr][pc] === 1) {
                        grid[r + pr][c + pc] = piece.color.bg;
                        placedCount++;
                    }
                }
            }

            playSound('place');
            score += placedCount * 10;

            // Consume piece
            availablePieces[selectedPieceIndex] = null;
            selectedPieceIndex = null;

            // Check lines / columns / 3x3 boxes for clearing
            checkAndClearLines();

            // Check if all 3 pieces are used
            if (availablePieces.every(p => p === null)) {
                generateNewPieces();
            } else {
                checkGameOver();
            }

            updateScoreDisplay();
            renderGrid();
            renderTray();
        }

        // --- Line Clearing & Scoring ---
        function checkAndClearLines() {
            let rowsToClear = [];
            let colsToClear = [];
            let boxesToClear = []; // 3x3 grids

            // Check rows
            for (let r = 0; r < GRID_SIZE; r++) {
                if (grid[r].every(cell => cell !== 0)) {
                    rowsToClear.push(r);
                }
            }

            // Check cols
            for (let c = 0; c < GRID_SIZE; c++) {
                let full = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (grid[r][c] === 0) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            // Check 3x3 subgrids
            for (let br = 0; br < 3; br++) {
                for (let bc = 0; bc < 3; bc++) {
                    let full = true;
                    for (let r = 0; r < 3; r++) {
                        for (let c = 0; c < 3; c++) {
                            if (grid[br * 3 + r][bc * 3 + c] === 0) {
                                full = false;
                                break;
                            }
                        }
                    }
                    if (full) boxesToClear.push({ br, bc });
                }
            }

            const totalClears = rowsToClear.length + colsToClear.length + boxesToClear.length;
            if (totalClears > 0) {
                playSound('clear');
                
                // Clear rows
                rowsToClear.forEach(r => {
                    for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = 0;
                });

                // Clear cols
                colsToClear.forEach(c => {
                    for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = 0;
                });

                // Clear boxes
                boxesToClear.forEach(b => {
                    for (let r = 0; r < 3; r++) {
                        for (let c = 0; c < 3; c++) {
                            grid[b.br * 3 + r][b.bc * 3 + c] = 0;
                        }
                    }
                });

                // Bonus score for multiple line clears
                const bonus = totalClears > 1 ? totalClears * 50 : 0;
                score += (totalClears * 100) + bonus;
                showToast(`✨ ${totalClears}개 라인 클리어! (+${(totalClears * 100) + bonus})`);
            }

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('block_puzzle_highscore', highScore);
                highScoreEl.textContent = highScore;
            }
        }

        // --- Game Over Check ---
        function checkGameOver() {
            // Check if any available piece can fit anywhere on the grid
            const remainingPieces = availablePieces.filter(p => p !== null);
            if (remainingPieces.length === 0) return;

            let possible = false;
            for (let piece of remainingPieces) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canPlace(r, c, piece.shape)) {
                            possible = true;
                            break;
                        }
                    }
                    if (possible) break;
                }
                if (possible) break;
            }

            if (!possible) {
                stopBGM();
                playSound('gameover');
                finalScoreEl.textContent = score;
                gameOverModal.classList.remove('hidden');
            }
        }

        // --- UI Helpers ---
        function updateScoreDisplay() {
            scoreEl.textContent = score;
            highScoreEl.textContent = highScore;
        }

        let toastTimeout;
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.remove('opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('opacity-0');
            }, 2000);
        }

        // --- Event Listeners ---
        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundText.textContent = soundEnabled ? '소리 켜짐' : '소리 꺼짐';
            soundBtn.classList.toggle('opacity-50', !soundEnabled);
        });

        musicBtn.addEventListener('click', () => {
            initAudio();
            musicEnabled = !musicEnabled;
            musicText.textContent = musicEnabled ? 'BGM 켜짐' : 'BGM 꺼짐';
            musicBtn.classList.toggle('opacity-50', !musicEnabled);

            if (musicEnabled) {
                startBGM();
            } else {
                stopBGM();
            }
        });

        // Initialize on load
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
